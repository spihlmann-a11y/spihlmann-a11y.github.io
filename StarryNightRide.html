<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StarryNightRide</title>
<style>
/* VOICE: a night painting you can ride through; quiet UI that stays out of the canvas
   IDEA: the screen is a wet oil canvas; the HUD is a small brass plaque on the frame
   PICTURE: the full-bleed real-time painting
   COLOUR and TYPE: ultramarine night, chrome-yellow accents; Cormorant Garamond + system sans
   LAYOUT: plaque top-left, controls top-right, touch joystick bottom-left, jump bottom-right */
html,body{margin:0;height:100%;overflow:hidden;background:#0b1440;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}
canvas:active{cursor:grabbing}
.ui{position:fixed;z-index:3;font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#f3e3a6}
#plaque{top:12px;left:12px;padding:10px 14px;background:rgba(10,18,55,.62);border:1px solid rgba(243,210,110,.35);border-radius:10px;max-width:min(420px,70vw);backdrop-filter:blur(3px)}
#plaque h1{margin:0 0 2px;font:600 22px/1.05 "Cormorant Garamond",Georgia,serif;letter-spacing:.02em;color:#f7d76a}
#plaque p{margin:2px 0 0;color:#cfd8f5;font-size:12.5px}
#mode{color:#f7d76a}
#btns{top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
#btns button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid rgba(243,210,110,.45);background:rgba(10,18,55,.66);color:#f3e3a6;font:600 13px system-ui,sans-serif;cursor:pointer}
#btns button[aria-pressed=true]{background:#e8b93a;color:#10183f}
#btns button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#stats{bottom:10px;left:50%;transform:translateX(-50%);font:11px/1.3 ui-monospace,Menlo,monospace;color:#aab6e0;background:rgba(10,18,55,.45);padding:4px 10px;border-radius:8px;white-space:nowrap}
#joy{left:22px;bottom:34px;width:130px;height:130px;border-radius:50%;background:rgba(10,18,55,.35);border:2px solid rgba(243,210,110,.4);display:none;touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:rgba(243,210,110,.55);border:2px solid #f7d76a}
#jump{right:26px;bottom:44px;width:86px;height:86px;border-radius:50%;background:rgba(232,185,58,.55);border:2px solid #f7d76a;display:none;align-items:center;justify-content:center;font:700 15px system-ui;color:#10183f;touch-action:none}
body.touch #joy{display:block}body.touch #jump{display:flex}body.touch #keys{display:none}
#loading{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 60% 35%,#2a4fa8,#0b1440 70%);color:#f7d76a;font:600 28px/1.1 "Cormorant Garamond",Georgia,serif;text-align:center;padding:20px}
#loading small{font:13px system-ui,sans-serif;color:#cfd8f5;margin-top:10px}
#bar{width:min(320px,70vw);height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:14px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#f7d76a;transition:width .2s}
.hide .ui:not(#btns){opacity:0;pointer-events:none}
@media (max-width:600px){#plaque{max-width:56vw}#plaque p#keys{display:none}#plaque h1{font-size:19px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="plaque" class="ui"><h1>StarryNightRide</h1>
<p id="keys">WASD ride · Shift gallop · Space jump · drag to look · wheel to zoom · T tour · F auto-ride · H hide</p>
<p>Mode: <span id="mode">auto-ride</span></p></div>
<div id="btns" class="ui">
<button id="bTour" aria-pressed="false">Tour</button>
<button id="bAuto" aria-pressed="true">Auto-ride</button>
<button id="bHide" aria-pressed="false">Hide UI</button>
</div>
<div id="stats" class="ui"></div>
<div id="joy" class="ui"><div id="knob"></div></div>
<div id="jump" class="ui">JUMP</div>
<div id="loading"><div>StarryNightRide</div><small id="ltext">Mixing paint…</small><div id="bar"><i id="lbar"></i></div></div>

<script type="module">
{
// ======================================================================
//  Settings
// ======================================================================
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const isTouch = (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) && !QS.has('desktop') || QS.has('mobile');
if (isTouch) document.body.classList.add('touch');
const Q = QS.has('q') ? parseFloat(QS.get('q')) : (isTouch ? 0.36 : 1.0); // stroke density factor
const SQ = 1 / Math.sqrt(Q);
const DPR = Math.min(window.devicePixelRatio || 1, isTouch ? 4 : 2);  // actual screen pixels
const RAPIER_URLS = ['https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs',
                     'https://unpkg.com/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs'];

// ======================================================================
//  Small math
// ======================================================================
const TAU = Math.PI * 2;
let _s = 1;
const srand = s => { _s = s >>> 0; };
function rnd() { _s = (_s + 0x6D2B79F5) | 0; let t = Math.imul(_s ^ (_s >>> 15), 1 | _s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const mix = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const v3 = (x, y, z) => [x, y, z];
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vsc = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = a => Math.hypot(a[0], a[1], a[2]);
const vnorm = a => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const vlerp = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
const UP = [0, 1, 0];

// mat4, column-major
const m4 = () => { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; };
function mmul(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }
const mT = (x, y, z) => { const m = m4(); m[12] = x; m[13] = y; m[14] = z; return m; };
const mRx = t => { const c = Math.cos(t), s = Math.sin(t), m = m4(); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; };
const mRy = t => { const c = Math.cos(t), s = Math.sin(t), m = m4(); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; };
const mRz = t => { const c = Math.cos(t), s = Math.sin(t), m = m4(); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; };
const mBasis = (x, y, z, o) => { const m = m4(); m.set([x[0], x[1], x[2], 0, y[0], y[1], y[2], 0, z[0], z[1], z[2], 0, o[0], o[1], o[2], 1]); return m; };
const mul = (...ms) => ms.reduce((a, b) => mmul(a, b));
const xform = (m, p) => [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13], m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14]];
function persp(fov, asp, n, f) { const t = 1 / Math.tan(fov / 2), m = new Float32Array(16); m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m; }
function lookAt(e, c, up) { const z = vnorm(vsub(e, c)), x = vnorm(vcross(up, z)), y = vcross(z, x); const m = m4(); m.set([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -vdot(x, e), -vdot(y, e), -vdot(z, e), 1]); return m; }

// ======================================================================
//  World layout (shared by JS generation, physics and GLSL grass)
// ======================================================================
const riverZ = x => -170 + 28 * Math.sin(x * 0.0125) + 10 * Math.sin(x * 0.031 + 1.0);
const plateau = x => 24 * smooth(290, 298, x);
function H(x, z) {
  const r = Math.hypot(x, z);
  let h = 6 * Math.sin(x * 0.011 + 0.5) * Math.sin(z * 0.013 + 1.2) + 3 * Math.sin(x * 0.027 + z * 0.019) + 1.5 * Math.sin(x * 0.061 - z * 0.047 + 2.0);
  h *= mix(0.35, 1.0, smooth(70, 160, r));
  h += Math.max(r - 320, 0) * 0.08;
  const dr = Math.abs(z - riverZ(x));
  h *= smooth(8, 45, dr);
  h = mix(-2.8, h, smooth(5, 13, dr));
  return h + plateau(x);
}
const waterLevel = x => -1.2 + plateau(x);
function Hn(x, z) { const e = 0.6; return vnorm([H(x - e, z) - H(x + e, z), 2 * e, H(x, z - e) - H(x, z + e)]); }

// bridge (perpendicular to the river at x=-15)
const BR = (() => { const x = -15, z = riverZ(x); const dz = 28 * 0.0125 * Math.cos(x * 0.0125) + 10 * 0.031 * Math.cos(x * 0.031 + 1); const rd = vnorm([1, 0, dz]); const D = [rd[2], 0, -rd[0]]; return { c: [x, 0, z], D, half: 17.5, wid: 2.6 }; })();
BR.a = vadd(BR.c, vsc(BR.D, -BR.half)); BR.b = vadd(BR.c, vsc(BR.D, BR.half));
BR.ha = H(BR.a[0], BR.a[2]); BR.hb = H(BR.b[0], BR.b[2]);
const deckY = s => mix(BR.ha, BR.hb, (s / BR.half + 1) / 2) + 1.8 * (1 - (s / BR.half) ** 2) + 0.15;
function bridgeLocal(x, z) { const dx = x - BR.c[0], dz = z - BR.c[2]; return [dx * BR.D[0] + dz * BR.D[2], -dx * BR.D[2] + dz * BR.D[0]]; }

const VILLAGE = [-70, -290];
const CHURCH = [-98, -312];
const ROADS = [
  [[0, -60], [BR.a[0], BR.a[2]]], [[BR.a[0], BR.a[2]], [BR.b[0], BR.b[2]]], [[BR.b[0], BR.b[2]], VILLAGE],
  [VILLAGE, [-125, -300]], [VILLAGE, [-35, -325]], [VILLAGE, [-60, -350]]
];
function segDist(px, pz, a, b) { const ax = b[0] - a[0], az = b[1] - a[1]; let t = ((px - a[0]) * ax + (pz - a[1]) * az) / (ax * ax + az * az); t = clamp(t, 0, 1); return Math.hypot(px - a[0] - ax * t, pz - a[1] - az * t); }
function roadInfo(x, z) { let best = 1e9, dir = [1, 0]; for (const [a, b] of ROADS) { const d = segDist(x, z, a, b); if (d < best) { best = d; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); dir = [(b[0] - a[0]) / l, (b[1] - a[1]) / l]; } } return [best, dir]; }
const WHEAT = [{ cx: 150, cz: 95, hw: 42, hd: 30, a: 0.3 }, { cx: -140, cz: 60, hw: 35, hd: 45, a: -0.2 }, { cx: 130, cz: -110, hw: 30, hd: 20, a: 0.5 }, { cx: -165, cz: -60, hw: 30, hd: 25, a: 0.1 }];
function inWheat(x, z) { for (const w of WHEAT) { const c = Math.cos(w.a), s = Math.sin(w.a), dx = x - w.cx, dz = z - w.cz; const lx = dx * c + dz * s, lz = -dx * s + dz * c; if (Math.abs(lx) < w.hw && Math.abs(lz) < w.hd) return true; } return false; }
const WINDMILL = [105, -25], COTTAGE = [82, -58];
const BIGCYP = [-21, 44];

// obstacles on the ring path (radius 60)
const OBST = [];
[22.5, 67.5, 112.5, 157.5, 202.5, 237.5, 302.5, 337.5].forEach((deg, i) => {
  const th = deg * Math.PI / 180, cx = 60 * Math.cos(th), cz = 60 * Math.sin(th);
  OBST.push({ th, type: ['fence', 'wall', 'log'][i % 3], c: [cx, H(cx, cz), cz], rd: [Math.cos(th), 0, Math.sin(th)], hl: 3.6, hh: 0.45, ht: 0.28 });
});
function groundHeight(x, z) {
  let h = H(x, z);
  const [s, t] = bridgeLocal(x, z);
  if (Math.abs(s) < BR.half && Math.abs(t) < BR.wid + 0.2) h = Math.max(h, deckY(s));
  return h;
}

// GLSL versions of the layout functions (for real-time grass)
const f = n => "(" + (Math.round(n * 1e4) / 1e4).toFixed(4) + ")";
const GLSL_WORLD = `
float riverZ(float x){ return -170.0 + 28.0*sin(x*0.0125) + 10.0*sin(x*0.031+1.0); }
float terrainH(float x, float z){
  float r = sqrt(x*x+z*z);
  float h = 6.0*sin(x*0.011+0.5)*sin(z*0.013+1.2) + 3.0*sin(x*0.027+z*0.019) + 1.5*sin(x*0.061-z*0.047+2.0);
  h *= mix(0.35,1.0,smoothstep(70.0,160.0,r));
  h += max(r-320.0,0.0)*0.08;
  float dr = abs(z-riverZ(x));
  h *= smoothstep(8.0,45.0,dr);
  h = mix(-2.8,h,smoothstep(5.0,13.0,dr));
  return h + 24.0*smoothstep(290.0,298.0,x);
}
float segD(vec2 p, vec2 a, vec2 b){ vec2 ab=b-a; float t=clamp(dot(p-a,ab)/dot(ab,ab),0.0,1.0); return length(p-a-ab*t); }
float roadDist(vec2 p){ float d=1e9; ${ROADS.map(([a, b]) => `d=min(d,segD(p,vec2(${f(a[0])},${f(a[1])}),vec2(${f(b[0])},${f(b[1])})));`).join('')} return d; }
bool inWheat(float x, float z){ ${WHEAT.map(w => `{ vec2 d=vec2(x-${f(w.cx)},z-${f(w.cz)}); float c=${f(Math.cos(w.a))}, s=${f(Math.sin(w.a))}; if(abs(d.x*c+d.y*s)<${f(w.hw)} && abs(-d.x*s+d.y*c)<${f(w.hd)}) return true; }`).join('')} return false; }
`;

// ======================================================================
//  Palettes [highlight paint, shadow paint]
// ======================================================================
const PAL = {
  meadow: [[0.30, 0.45, 0.40], [0.06, 0.12, 0.18]], meadow2: [[0.40, 0.50, 0.32], [0.09, 0.15, 0.17]],
  field: [[0.33, 0.40, 0.26], [0.07, 0.11, 0.14]], path: [[0.66, 0.58, 0.42], [0.20, 0.19, 0.26]],
  road: [[0.60, 0.53, 0.42], [0.19, 0.18, 0.25]], wheatG: [[0.72, 0.60, 0.32], [0.22, 0.20, 0.24]],
  bank: [[0.38, 0.40, 0.38], [0.09, 0.11, 0.18]], rock: [[0.52, 0.52, 0.55], [0.13, 0.14, 0.22]],
  village: [[0.46, 0.46, 0.40], [0.12, 0.13, 0.19]],
  petal: [[0.98, 0.78, 0.22], [0.58, 0.46, 0.20]], seed: [[0.40, 0.25, 0.12], [0.10, 0.07, 0.07]],
  stem: [[0.32, 0.44, 0.28], [0.06, 0.12, 0.12]], wheat: [[0.80, 0.68, 0.36], [0.25, 0.24, 0.27]],
  cypress: [[0.13, 0.32, 0.26], [0.02, 0.06, 0.10]], cypress2: [[0.20, 0.36, 0.22], [0.03, 0.07, 0.09]],
  tree: [[0.22, 0.40, 0.33], [0.05, 0.10, 0.14]], trunk: [[0.32, 0.24, 0.18], [0.08, 0.06, 0.08]],
  wallW: [[0.66, 0.67, 0.62], [0.16, 0.19, 0.32]], wallO: [[0.70, 0.58, 0.38], [0.20, 0.17, 0.25]],
  roofB: [[0.32, 0.32, 0.52], [0.07, 0.08, 0.20]], roofR: [[0.56, 0.32, 0.26], [0.14, 0.08, 0.14]],
  steeple: [[0.22, 0.27, 0.50], [0.04, 0.06, 0.16]], frame: [[0.20, 0.16, 0.14], [0.05, 0.05, 0.08]],
  plaster: [[0.66, 0.62, 0.52], [0.17, 0.17, 0.27]], wood: [[0.50, 0.38, 0.26], [0.12, 0.10, 0.13]],
  cloth: [[0.80, 0.76, 0.64], [0.20, 0.22, 0.32]], stone: [[0.56, 0.55, 0.52], [0.15, 0.16, 0.24]],
  bark: [[0.45, 0.32, 0.22], [0.11, 0.08, 0.09]], fence: [[0.58, 0.46, 0.32], [0.14, 0.11, 0.13]],
  horse: [[0.60, 0.34, 0.18], [0.17, 0.09, 0.09]], mane: [[0.18, 0.10, 0.07], [0.04, 0.03, 0.04]],
  saddle: [[0.45, 0.24, 0.12], [0.11, 0.06, 0.06]], blanket: [[0.62, 0.22, 0.15], [0.16, 0.05, 0.08]],
  cloak: [[0.24, 0.42, 0.90], [0.04, 0.08, 0.30]], hat: [[0.48, 0.36, 0.22], [0.11, 0.08, 0.10]],
  skin: [[0.86, 0.66, 0.52], [0.28, 0.20, 0.24]], trousers: [[0.26, 0.24, 0.30], [0.05, 0.05, 0.09]],
  hoof: [[0.14, 0.11, 0.09], [0.03, 0.03, 0.04]], metal: [[0.30, 0.26, 0.20], [0.06, 0.05, 0.06]],
  water: [[0.13, 0.27, 0.55], [0.05, 0.10, 0.28]], foam: [[0.85, 0.90, 0.95], [0.45, 0.55, 0.72]],
};
const GLOW = [1.0, 0.80, 0.34], GLOW2 = [1.0, 0.66, 0.22];

// ======================================================================
//  Stroke store: pos(3) w l rank | N(3) kind T(3) group | c0 aux c1 -
//  kinds: 0 lit solid · 1 sky/halo flow · 2 water · 3 emissive · 4 lit foliage (sway) · 5 star pulse · 6 waterfall
// ======================================================================
const S = { n: 0, cap: 0, F: null, I: null, U: null };
function sInit(cap) { S.cap = cap; S.n = 0; S.F = new Float32Array(cap * 6); S.I = new Int8Array(cap * 8); S.U = new Uint8Array(cap * 8); }
function sGrow() { const nc = Math.ceil(S.cap * 1.5); const F = new Float32Array(nc * 6), I = new Int8Array(nc * 8), U = new Uint8Array(nc * 8); F.set(S.F); I.set(S.I); U.set(S.U); S.F = F; S.I = I; S.U = U; S.cap = nc; }
const cb = v => v <= 0 ? 0 : v >= 1 ? 255 : Math.round(v * 255);
function add(p, n, t, w, l, kind, group, c0, c1, aux = 0, cv = 0.05) {
  if (S.n >= S.cap) sGrow();
  let nx = n[0], ny = n[1], nz = n[2]; const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
  let tx = t[0], ty = t[1], tz = t[2]; let d = tx * nx + ty * ny + tz * nz; tx -= nx * d; ty -= ny * d; tz -= nz * d;
  let tl = Math.hypot(tx, ty, tz);
  if (tl < 1e-4) { if (Math.abs(ny) < 0.9) { tx = -nz; ty = 0; tz = nx; } else { tx = 1 - nx * nx; ty = -nx * ny; tz = -nx * nz; } tl = Math.hypot(tx, ty, tz) || 1; }
  tx /= tl; ty /= tl; tz /= tl;
  const i = S.n++, F = S.F, I = S.I, U = S.U, a = i * 6, b = i * 8;
  F[a] = p[0]; F[a + 1] = p[1]; F[a + 2] = p[2]; F[a + 3] = w; F[a + 4] = l; F[a + 5] = rnd();
  I[b] = Math.round(nx * 127); I[b + 1] = Math.round(ny * 127); I[b + 2] = Math.round(nz * 127); I[b + 3] = kind;
  I[b + 4] = Math.round(tx * 127); I[b + 5] = Math.round(ty * 127); I[b + 6] = Math.round(tz * 127); I[b + 7] = group;
  const v = (rnd() - 0.5) * cv * 2;
  U[b] = cb(c0[0] + v + (rnd() - .5) * cv); U[b + 1] = cb(c0[1] + v + (rnd() - .5) * cv); U[b + 2] = cb(c0[2] + v + (rnd() - .5) * cv); U[b + 3] = cb(aux);
  U[b + 4] = cb(c1[0] + v * 0.6); U[b + 5] = cb(c1[1] + v * 0.6); U[b + 6] = cb(c1[2] + v * 0.6);
}
const addP = (p, n, t, w, l, pal, kind = 0, group = 0, aux = 0) => add(p, n, t, w, l, kind, group, pal[0], pal[1], aux);

// ---- shape samplers -------------------------------------------------
function perp(a) { const t = Math.abs(a[1]) < 0.9 ? UP : [1, 0, 0]; const e1 = vnorm(vcross(a, t)); return [e1, vcross(a, e1)]; }
function ellipsoid(g, c, r, count, pal, w, l, tanFn, kind = 0, aux = 0, rot = null, filter = null) {
  count = Math.round(count);
  for (let i = 0; i < count; i++) {

function genUnder() {
  const pos = [], col = [], nrm = [], idx = [];
  const push = (p, c, n) => { pos.push(...p); col.push(...c); nrm.push(...n); return pos.length / 3 - 1; };
  // terrain
  const st = 6, E = 726, nG = Math.round(2 * E / st) + 1;
  const base = pos.length / 3;
  for (let j = 0; j < nG; j++) for (let i = 0; i < nG; i++) {
    const x = -E + i * st, z = -E + j * st; const reg = regionAt(x, z); const p = PAL[Hn(x, z)[1] < .78 ? 'rock' : reg];
    push([x, H(x, z) - 0.3, z], vlerp(p[1], p[0], 0.32), Hn(x, z));
  }
  for (let j = 0; j < nG - 1; j++) for (let i = 0; i < nG - 1; i++) { const a = base + j * nG + i; idx.push(a, a + nG, a + 1, a + 1, a + nG, a + nG + 1); }
  // river surface underpaint
  const rb = pos.length / 3; let nr = 0;
  for (let x = -726; x <= 726; x += 4) { const z = riverZ(x), y = waterLevel(x); push([x, y - 0.05, z - 9.5], [0.09, 0.19, 0.44], UP); push([x, y - 0.05, z + 9.5], [0.09, 0.19, 0.44], UP); nr++; }
  for (let k = 0; k < nr - 1; k++) { const a = rb + k * 2; idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
  // mountain silhouettes
  MTN.forEach((m, L) => {
    const mb = pos.length / 3, n = 900;
    for (let k = 0; k <= n; k++) { const az = k / n * TAU, rd = [Math.cos(az), 0, Math.sin(az)], hm = ridge(L, az); const nn = vnorm([-rd[0], 0.6, -rd[2]]); push([rd[0] * m.R, hm - m.R * 0.004, rd[2] * m.R], m.under, nn); push([rd[0] * m.R, -80, rd[2] * m.R], m.under, nn); }
    for (let k = 0; k < n; k++) { const a = mb + k * 2; idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
  });
  return { pos: new Float32Array(pos), col: new Float32Array(col), nrm: new Float32Array(nrm), idx: new Uint32Array(idx) };
}

const COMMON = `#version 300 es
precision highp float; precision highp int;
uniform mat4 u_vp; uniform vec3 u_cam; uniform float u_time;
uniform float u_focal, u_target, u_minPx, u_maxPx;
uniform vec3 u_moonDir; uniform vec4 u_lights[16]; uniform mat4 u_bones[15];
float hash(float n){ return fract(sin(n)*43758.5453123); }
float lampAt(vec3 P, vec3 N){

    float nd=dot(N,dv*inversesqrt(d2+1e-4))*0.5+0.6; s+=L.w*max(nd,0.0)/(1.0+d2*0.12); }
  return s;
}
vec3 paintLit(vec3 P, vec3 N, vec3 hi, vec3 lo, float j, out float lit){
  float m = clamp(dot(N,u_moonDir)*0.5+0.5, 0.0, 1.0);
  vec3 col = mix(lo, hi, smoothstep(0.32, 0.78, m + j*0.25));       // pick paint by received light
  float lum = dot(col, vec3(0.3,0.55,0.15));
  col = mix(col, lum*vec3(0.74,0.88,1.28), 0.36);                     // moonlight: bluish & desaturated
  float w = lampAt(P,N);

  col = mix(col, warm, clamp(w,0.0,0.92));                            // only lamp-lit areas turn warm

const STROKE_EMIT = `
out vec2 v_uv; flat out vec3 v_col; flat out float v_seed; flat out float v_lit;
void emitStroke(vec2 corner, vec3 P, vec3 N, vec3 T, float w, float l, float rank, float kind, vec3 c0, vec3 c1, float aux, float seed, float ext){
  v_uv = corner; v_seed = seed; v_lit = 0.5; v_col = vec3(0.0);
  vec4 cc = u_vp*vec4(P,1.0);
  if(cc.w < 0.05 || abs(cc.x) > cc.w*1.35+2.0 || abs(cc.y) > cc.w*1.35+2.0){ gl_Position=vec4(0.0,0.0,-2.0,1.0); return; }
  float d = length(P-u_cam);
  float shrink = ext;
  if(kind==1.0 || kind==2.0 || kind==6.0){                             // paint flowing along currents
    float spd = aux*(kind==1.0 ? 0.035 : kind==2.0 ? 0.45 : 1.1);
    float ph = fract(u_time*spd + seed*7.31);
    P += T*(ph-0.5)*l*(kind==1.0 ? 3.0 : 2.0);
    shrink *= smoothstep(0.0,0.16,ph)*smoothstep(1.0,0.84,ph);
  } else if(kind==4.0){
    P.x += sin(u_time*1.7 + P.x*0.15 + P.z*0.11)*0.25*aux;
    P.z += cos(u_time*1.3 + P.x*0.12 - P.z*0.13)*0.18*aux;
  } else if(kind==5.0){ shrink *= 0.92 + 0.12*sin(u_time*2.3 + seed*40.0); }

  float proj = sqrt(w*l)*u_focal/d;
  float k = clamp(proj/u_target, 0.0, 1.0); k *= k;                   // fraction of strokes kept
  float thr = k*1.25;
  float keep = 1.0 - smoothstep(thr-0.2, thr, rank);                  // the rest shrink away smoothly
  float s = min(inversesqrt(max(k,1e-4)), 5.0)*keep*shrink;           // survivors grow larger
  float px = proj*s;
  if(px > u_maxPx) s *= u_maxPx/px;                                   // upper size limit
  s *= smoothstep(u_minPx*0.5, u_minPx, px);                          // lower size limit: shrink & vanish
  if(s < 0.02){ gl_Position=vec4(0.0,0.0,-2.0,1.0); return; }
  vec3 B = normalize(cross(N,T)); vec3 Tn = cross(B,N);
  vec3 Wp = P + Tn*corner.x*l*0.5*s + B*corner.y*w*0.5*s;
  vec4 clip = u_vp*vec4(Wp,1.0);
  // front-to-back layer spacing that grows with distance -> stable ordering, no flicker
  float bias = (1.0-rank)*(0.0016*d + 0.012);
  vec4 cb = u_vp*vec4(Wp + normalize(u_cam-Wp)*bias, 1.0);
  clip.z = cb.z/cb.w*clip.w;
  gl_Position = clip;
  float j = hash(seed*3.7)-0.5, j2 = hash(seed*9.1)-0.5, j3 = hash(seed*1.9)-0.5;
  vec3 col; float lit = 1.0;

  else if(kind==2.0){
    vec3 V = normalize(P-u_cam); vec3 Rr = reflect(V, vec3(0,1,0)); Rr = normalize(Rr + vec3(j*0.09,0.0,j2*0.09));
    float e = clamp(Rr.y,0.0,1.0);
    vec3 sk = mix(vec3(0.16,0.40,0.52), vec3(0.05,0.17,0.52), sqrt(e));
    float mg = max(dot(Rr,u_moonDir),0.0);
    sk += vec3(1.0,0.72,0.2)*(pow(mg,90.0)*1.5 + pow(mg,10.0)*0.22);
    float wr = 0.0;
    for(int i=0;i<16;i++){ vec4 L=u_lights[i]; if(L.w<=0.0) continue; vec3 dl=L.xyz-P; float dd=length(dl); float g=max(dot(Rr,dl/dd),0.0); wr += L.w*pow(g,70.0)*min(40.0/dd,1.6); }

  }
  else if(kind==3.0){ col = c0*(0.92 + 0.12*sin(u_time*6.0 + seed*31.0)); lit = 1.0; col = haze(col,d,0.25); }
  else if(kind==6.0){ float m = clamp(dot(N,u_moonDir)*0.5+0.6,0.0,1.0); col = c0*(0.75+0.3*m); lit = 0.9; col = haze(col,d,0.4); }

`;

function resize() {

}

let acc = 0;
function update(dt) {

// test hooks (used by the headless checks)

  step(dt, n = 1) { for (let i = 0; i < n; i++) update(dt); render(); gl.finish(); return { pos: phys.pos.slice(), speed: horse.speed, grounded: phys.grounded, manual: horse.manual }; },
  setTour, setAuto, keys, cam, horse, phys, get resScale() { return resScale; }, set resScale(v) { resScale = v; resize(); },
  setTourT(t) { tourT = t; }, setView(e, t) { debugView = e ? [e, t] : null; }, jump() { jumpReq = true; }, obst: OBST,

boot().catch(e => { console.error(e); lt.textContent = 'Error: ' + e.message; window.SNR.error = e.message; });
}
